{% extends "base.html" %}

{% block title %}Account Login - AI Surplus Food Redistribution System{% endblock %}

{% block full_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h4 class="font-heading fw-bold mb-1"><i class="fa-solid fa-right-to-bracket me-2"></i> Account Login</h4>
                    <p class="small mb-0 text-white-50">Enter your email and password to access your role dashboard</p>
                </div>

                <div class="card-body p-4">
                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control rounded-3 py-2" id="email" name="email" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control rounded-3 py-2" id="password" name="password" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2.5 font-heading fw-bold rounded-3 shadow-sm">
                            <i class="fa-solid fa-lock-open me-2"></i> Sign In to Dashboard
                        </button>
                    </form>

                    <div class="text-center text-muted small mt-4 pt-3 border-top">
                        Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-primary">Register Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
